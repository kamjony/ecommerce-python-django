{% include 'store/base.html' %}
{% load static %}

{% load crispy_forms_tags %}

{% block content %}
    <style>
        body {
            background-color: gray;
        }

    </style>

    <br>

    <div class="container bg-white shadow-md p-5 form-layout">

        <h3> Enter your new password: </h3>
        <hr class="mt-3 mb-4" style="border-top: 2px solid black; opacity: 1;">

        <p> Please enter your new password twice so that we can verify 
            that you typed it in correctly! </p>


        <form method="post">

            {% csrf_token %}

            {{form|crispy}}

            <br>

            <button type="submit" class="btn btn-primary navbar-btn w-100 p-2"> Update password </button>
          
        </form>    
    </div>



{% endblock %}
